name: Production RAG API CI/CD

on:
  push:
    branches:
      - "feat/aiml-W8-UzmaEffath"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  quality-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r W8D1-Production-RAG/requirements.txt
          pip install -r W8D1-Production-RAG/requirements-dev.txt

      - name: Run Ruff lint checks
        run: |
          ruff check W8D1-Production-RAG/app W8D1-Production-RAG/tests

      - name: Run automated tests
        run: |
          pytest W8D1-Production-RAG/tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/production-rag-api" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./W8D1-Production-RAG
          file: ./W8D1-Production-RAG/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
